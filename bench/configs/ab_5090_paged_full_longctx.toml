# The long-context half of the round-2 full-stack A/B (see
# ab_5090_paged_full.toml for the framing): 4 slots x 10240, both arms
# complete pipelines, attention + KV layout flipping.
#
# Gate (§6 prediction 1): flex within -8%..+2% of padded on
# long_context c=1. KNOWN CAVEAT on record: round 1 measured the c=1
# residual as entirely kernel time (-17.2%, identical across both
# round-1 runs), so this range is expected to MISS until the deferred
# flex decode-kernel tuning lands; the cells where graphs can move the
# number are c=2/4, whose round-1 flex-side host gap was ~43% of the
# delta. Grade honestly against the prediction as written.
schema_version = 1
name = "ab-5090-paged-full-longctx"

[server]
model = "0.6B"
engine = "batched"
device = "cuda"
port = 8377
health_timeout_s = 900
max_batch = 4
batch_max_seq_len = 10240
max_tokens_per_step = 512
shape_buckets = true
warmup_shapes = true
torch_compile = true
cuda_graphs = true

[server.matrix]
attention = ["sdpa", "flex"]

[defaults]
dialect = "openai"
max_tokens = 128
ignore_eos = true
temperature = 0.0
warmup_requests = 4
repeats = 3
seed = 0

[[points]]
workload = "long_context"
mode = "closed"
concurrency = [1, 2, 4]
requests_per_level = 16

[[points]]
workload = "long_context"
mode = "closed"
concurrency = [4]
requests_per_level = 32
