# The long-context half of the H100 anchor run (see ab_h100_compile.toml
# for the framing): ab_5090_compile_longctx re-run unchanged on 1x H100
# 80GB. Two arms, baseline vs compile-dynamic, 4 x 10240 geometry; the
# 5090 sibling is bench/history/2026-08-08T224249_9b49283_ab-5090-compile-
# longctx. Predictions on record: h100-plan.md §4.
schema_version = 1
name = "ab-h100-compile-longctx"

[server]
model = "0.6B"
engine = "batched"
device = "cuda"
port = 8378
# 1800 not 900: raised on the node during the H100 day (the compiled
# arm's cold Ready came in at 725 s; h100-results.md §3). The recorded
# run used 1800.
health_timeout_s = 1800
max_batch = 4
batch_max_seq_len = 10240
max_tokens_per_step = 512
shape_buckets = true
warmup_shapes = true
cuda_graphs = true
torch_compile_strategy = "dynamic"

[server.matrix]
torch_compile = [false, true]

[defaults]
dialect = "openai"
max_tokens = 128
ignore_eos = true
temperature = 0.0
warmup_requests = 4
repeats = 3
seed = 0

[[points]]
workload = "long_context"
mode = "closed"
concurrency = [1, 2, 4]
requests_per_level = 16

[[points]]
workload = "long_context"
mode = "closed"
concurrency = [4]
requests_per_level = 32
