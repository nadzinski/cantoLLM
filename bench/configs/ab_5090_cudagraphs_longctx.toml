# The long-context half of the CUDA-graphs A/B (see ab_5090_cudagraphs.toml
# for the framing). Split out for the same reason as the baselines: 8k-token
# prompts exceed 4096-token slots, so this half runs the shape-buckets A/B's
# geometry (4 slots x 10240) with only cuda_graphs flipping.
#
# Prediction on record (cuda-graphs-design.md §6): within noise of the
# current default. Long context is compute-bound (prefill chunks, big
# gathers) and SDPA already owns it — graphs remove launch overhead, which
# is not this workload's bottleneck. The A/B gate is non-regression
# (> -3%); a surprise either way is worth understanding, not averaging.
schema_version = 1
name = "ab-5090-cudagraphs-longctx"

[server]
model = "0.6B"
engine = "batched"
device = "cuda"
port = 8377
health_timeout_s = 900
max_batch = 4
batch_max_seq_len = 10240
max_tokens_per_step = 512
shape_buckets = true
warmup_shapes = true
# Pinned 2026-08-09: this A/B was measured without torch.compile (it
# predates the compile round); re-runs must not inherit the new CUDA
# default-on.
torch_compile = false

[server.matrix]
cuda_graphs = [false, true]

[defaults]
dialect = "openai"
max_tokens = 128
ignore_eos = true
temperature = 0.0
warmup_requests = 4
repeats = 3
seed = 0

[[points]]
workload = "long_context"
mode = "closed"
concurrency = [1, 2, 4]
requests_per_level = 16

[[points]]
workload = "long_context"
mode = "closed"
concurrency = [4]
requests_per_level = 32
