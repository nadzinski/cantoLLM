# Phase-4 round 4, long-context half (paged-kv-plan.md §7, chunk 12):
# overlap on/off x {padded, paged} at the longctx geometry. Graphs stay
# OFF here to mirror ab_5090_paged_longctx.toml (its arms measured the
# compile stacks; comparability beats stack-maximalism on this file).
#
# Prediction 6 makes no longctx promise; these cells are attribution:
# long prefill chunks are GPU-heavy, so overlap's CPU-hiding should
# matter least here — if longctx moves more than short_chat, something
# other than dispatch overlap moved.
#
# Gates: greedy token equivalence vs the serial siblings; no NaN; zero
# recompiles after warm-up; error counts zero.
schema_version = 1
name = "ab-5090-overlap-longctx"

[server]
model = "0.6B"
engine = "batched"
device = "cuda"
port = 8377
health_timeout_s = 900
max_batch = 4
batch_max_seq_len = 10240
max_tokens_per_step = 512
shape_buckets = true
warmup_shapes = true
torch_compile = true
cuda_graphs = false

[server.matrix]
attention = ["sdpa", "flex"]
overlap_scheduling = [false, true]

[defaults]
dialect = "openai"
max_tokens = 128
ignore_eos = true
temperature = 0.0
warmup_requests = 4
repeats = 3
seed = 0

[[points]]
workload = "long_context"
mode = "closed"
concurrency = [1, 4]
requests_per_level = 16
