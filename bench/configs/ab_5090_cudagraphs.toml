# Phase-3 A/B, round 3: do CUDA graphs collapse the decode dispatch floor?
# step-profiling.md put the floor at ~9 ms of per-step CPU dispatch (~1900
# CUDA API calls); SDPA could not touch it (short_chat moved ~-1% in its
# A/B) because fused kernels shrink the ride, not the toll. This run holds
# the serve default (sdpa + buckets + warm-up) and flips only cuda_graphs:
# one graph captured per decode shape behind readiness, replayed for
# matching steps, eager for the rest.
#
# Geometry matches the 2026-07-18 baseline_5090_batched (16 slots, 4096
# capacity): the target is the decode flood, which wants decode-heavy
# batches. long_context needs 10240-token slots and runs in its sibling
# config ab_5090_cudagraphs_longctx.toml (the same split as the baselines).
#
# Predictions on record (cuda-graphs-design.md §6): short_chat c=16
# aggregate 1469 -> 1900-2300 tok/s; decode-step hit rate >= 95%
# (StepStats graph_replayed); capture adds ~40-90 s to the warm-up bill.
# Gates (§7): short_chat >= +20%, and the longctx sibling > -3%.
schema_version = 1
name = "ab-5090-cudagraphs"

[server]
model = "0.6B"
engine = "batched"
# Pinned 2026-08-31: the CUDA serve default flipped to flex+paged
# (paged-kv-plan.md §9.8); this config predates the flip and re-runs
# must reproduce what it measured.
attention = "sdpa"
device = "cuda"
port = 8377
health_timeout_s = 900
max_batch = 16
batch_max_seq_len = 4096
max_tokens_per_step = 512
shape_buckets = true
warmup_shapes = true
# Pinned 2026-08-09: this A/B was measured without torch.compile (it
# predates the compile round); re-runs must not inherit the new CUDA
# default-on.
torch_compile = false

[server.matrix]
cuda_graphs = [false, true]

[defaults]
dialect = "openai"
max_tokens = 128
ignore_eos = true
temperature = 0.0
warmup_requests = 4
repeats = 3
seed = 0

[[points]]
workload = "short_chat"
mode = "closed"
concurrency = [4, 16]
requests_per_level = 32

[[points]]
workload = "code"
mode = "closed"
concurrency = [8]
requests_per_level = 32

[[points]]
workload = "multi_turn"
mode = "closed"
concurrency = [8]
requests_per_level = 32
