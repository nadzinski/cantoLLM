# 32B on 1x H100 80GB, arm 2 of 2: everything off. Padded attention, no
# buckets, no warm-up, no graphs, no compile; the pre-Phase-3 engine, on
# the big model. Pair of
# ab_h100_32b_default.toml; see that file for the framing and geometry
# notes. Ready here is just load time, which isolates the default arm's
# warm-up/capture/compile bill by subtraction.
schema_version = 1
name = "ab-h100-32b-eager"

[server]
model = "32B"
engine = "batched"
device = "cuda"
port = 8378
health_timeout_s = 1800
max_batch = 8
batch_max_seq_len = 4096
max_tokens_per_step = 512
attention = "padded"
shape_buckets = false
warmup_shapes = false
cuda_graphs = false
torch_compile = false

[defaults]
dialect = "openai"
max_tokens = 128
ignore_eos = true
temperature = 0.0
warmup_requests = 4
repeats = 3
seed = 0

[[points]]
workload = "short_chat"
mode = "closed"
concurrency = [4, 8]
requests_per_level = 32

[[points]]
workload = "code"
mode = "closed"
concurrency = [8]
requests_per_level = 24
