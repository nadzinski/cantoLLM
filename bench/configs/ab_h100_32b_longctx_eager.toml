# The long-context half of the 32B A/B on 1x H100 80GB, arm 2 of 2:
# everything off (padded attention, no buckets, no warm-up, no graphs,
# no compile). Pair of ab_h100_32b_longctx_default.toml; geometry and
# repeat notes live there.
schema_version = 1
name = "ab-h100-32b-longctx-eager"

[server]
model = "32B"
engine = "batched"
device = "cuda"
port = 8378
health_timeout_s = 1800
max_batch = 2
batch_max_seq_len = 10240
max_tokens_per_step = 512
attention = "padded"
shape_buckets = false
warmup_shapes = false
cuda_graphs = false
torch_compile = false

[defaults]
dialect = "openai"
max_tokens = 128
ignore_eos = true
temperature = 0.0
warmup_requests = 2
repeats = 2
seed = 0

[[points]]
workload = "long_context"
mode = "closed"
concurrency = [1, 2]
requests_per_level = 16
