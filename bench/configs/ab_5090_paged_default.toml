# The third §7 round-1 arm: the padded FULL serve default (sdpa + buckets
# + warm-up + graphs + compile), run fresh in the same session as
# ab_5090_paged.toml so all three arms share a driver and a day. This arm
# is the standing champion the paged stack must eventually beat (round 2,
# once flex gets graphs in chunk 8); in round 1 it quantifies what graphs
# add on top of the compile-no-graphs padded arm, so the flex gap
# decomposes cleanly into "layout + kernel" vs "missing graphs".
#
# Cross-checks: short_chat c=16 at this geometry measured 3683 tok/s in
# the 2026-08-09 compile A/B and 3595.9 in the 2026-08-16 metrics-on
# record; a fresh median far off that range means the box, not the code.
# The longctx default arm is not re-run (its record is the 2026-08-09
# compile A/B); the longctx pair lives in ab_5090_paged_longctx.toml.
schema_version = 1
name = "ab-5090-paged-default"

[server]
model = "0.6B"
engine = "batched"
device = "cuda"
port = 8377
health_timeout_s = 900
max_batch = 16
batch_max_seq_len = 4096
max_tokens_per_step = 512
attention = "sdpa"
shape_buckets = true
warmup_shapes = true
torch_compile = true
cuda_graphs = true

[defaults]
dialect = "openai"
max_tokens = 128
ignore_eos = true
temperature = 0.0
warmup_requests = 4
repeats = 3
seed = 0

[[points]]
workload = "short_chat"
mode = "closed"
concurrency = [4, 16]
requests_per_level = 32

[[points]]
workload = "code"
mode = "closed"
concurrency = [8]
requests_per_level = 32

[[points]]
workload = "multi_turn"
mode = "closed"
concurrency = [8]
requests_per_level = 32
