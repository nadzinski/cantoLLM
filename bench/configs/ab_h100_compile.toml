# H100 anchor run: ab_5090_compile re-run unchanged on 1x H100 80GB
# (p5.4xlarge), per h100-plan.md. Same four arms as the 5090 round
# (baseline pair as repeat-noise reference, compile-dynamic,
# compile-batch-bucket), same geometry, so every cell has a direct
# 5090 sibling in bench/history/2026-08-08T222750_9b49283_ab-5090-compile.
# This is the cross-hardware comparison AND the "does compile have more
# headroom on Hopper" answer in one run.
#
# Predictions on record: h100-plan.md §4. Record Ready time per arm cold
# and warm; the second server spawn of each compiled arm is the warm
# number.
schema_version = 1
name = "ab-h100-compile"

[server]
model = "0.6B"
engine = "batched"
device = "cuda"
port = 8378
health_timeout_s = 900
max_batch = 16
batch_max_seq_len = 4096
max_tokens_per_step = 512
shape_buckets = true
warmup_shapes = true
cuda_graphs = true

[server.matrix]
torch_compile = [false, true]
torch_compile_strategy = ["dynamic", "batch-bucket"]

[defaults]
dialect = "openai"
max_tokens = 128
ignore_eos = true
temperature = 0.0
warmup_requests = 4
repeats = 3
seed = 0

[[points]]
workload = "short_chat"
mode = "closed"
concurrency = [4, 16]
requests_per_level = 32

[[points]]
workload = "code"
mode = "closed"
concurrency = [8]
requests_per_level = 32

[[points]]
workload = "multi_turn"
mode = "closed"
concurrency = [8]
requests_per_level = 32
