# Phase-4 round 3, the goodput round (paged-kv-plan.md §7, chunk 11):
# victim policies under real scarcity, judged by goodput under a joint
# client-experienced SLO, NOT by aggregate tok/s, which §7 predicts flat
# across the policy matrix and this file says so up front.
#
# v2 (2026-08-30). The first attempt (this file at c7c1915; run
# b3040f2, flagged INVALID in bench/history) produced ZERO preemptions:
# short_chat's footprint stops growing 128 tokens after admission, and
# admission-time first-block gating + grant-shrink + fast request
# turnover absorbed every shortage before total starvation, so scarcity
# pooled in the ADMISSION queue (TTFT p50 3-5 s) instead of forcing
# evictions; its 45 rps cells were also load-generator-bound. Lesson,
# on record: eviction needs PER-REQUEST GROWTH that outruns the free
# rate after admission. v2 therefore uses long generations
# (max_tokens = 512, ~9 blocks eventual footprint) over the minimum
# legal pool (num_kv_blocks = 64 = one max-length request), so ~7
# full-grown requests fit while 16 slots keep admitting: sustained
# growth-shortage, evictions must fire (gate below). Rates bracket the
# knee for this geometry (~2 400 tok/s / 552 tok per request ~= 4.3
# rps): 3 rps under it (scarcity still binds: ~10 concurrent x 9
# blocks > 64), 5 rps past it. Server max_inflight raised to 256 so
# the deep open-loop queue waits in the scheduler, not in 429s; client
# cap 240 stays under it.
#
# SLO pair (§9.3 straw, adopted for this round): TTFT <= 0.5 s, per-
# request client ITL p99 <= 0.1 s. Long generations make the ITL
# clause the eviction-sensitive one (a victim's requeue + re-prefill
# gap lands in ITS OWN ITL tail), TTFT the queue-sensitive one.
#
# Predictions on record (§6.5): the `priority` policy raises
# high-priority (class 2) goodput by >= 15 points over `lifo` while
# aggregate tok/s stays within +/-2% across all three policies; `cost`
# beats `lifo` on total goodput but not on high-priority goodput.
# Prediction 4's clauses ride along: every request completes (no
# errors), and the mean re-prefill (preempted_tokens / preemptions)
# stays around one prefill chunk (512-token step budget vs <= 552-token
# replay prefixes).
#
# Standing gates: preemptions_total > 0 on EVERY cell or the round is
# invalid again; no NaN; zero recompiles after warm-up; decode replay
# ~100%; every request completes; no dispatch-lag/inflight-cap
# warnings (rates are 6-15x lower than v1's).
schema_version = 1
name = "goodput-5090"

[server]
model = "0.6B"
engine = "batched"
device = "cuda"
port = 8377
health_timeout_s = 900
max_batch = 16
batch_max_seq_len = 4096
max_tokens_per_step = 512
attention = "flex"
num_kv_blocks = 64
max_inflight = 256
shape_buckets = true
warmup_shapes = true
torch_compile = true
cuda_graphs = true

[server.matrix]
preemption_policy = ["lifo", "priority", "cost"]

[defaults]
dialect = "openai"
max_tokens = 512
ignore_eos = true
temperature = 0.0
warmup_requests = 8
repeats = 3
seed = 0

[[points]]
workload = "short_chat"
mode = "open"
arrivals = "poisson"
rate_rps = [3, 5]
total_requests = 200
max_inflight = 240
priority_mix = {0 = 4, 2 = 1}
slo_ttft_s = 0.5
slo_itl_p99_s = 0.1
