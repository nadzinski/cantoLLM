# Phase-4 round 3, the goodput round (paged-kv-plan.md §7, chunk 11):
# victim policies under real scarcity, judged by goodput under a joint
# client-experienced SLO, NOT by aggregate tok/s, which §7 predicts flat
# across the policy matrix and this file says so up front.
#
# Scarcity by construction: 64 slots over num_kv_blocks = 128 (the
# capacity run's 64-slot geometry undercommitted 8x from its 1024-block
# parity; short_chat at full batch wants ~190 blocks, so sustained
# overload MUST evict). Open loop past saturation so the queue never
# empties; priority_mix 4:1 (priority 0 : priority 2) gives the
# policies something to disagree about.
#
# SLO pair (§9.3 straw, adopted for this round): TTFT <= 0.5 s, per-
# request client ITL p99 <= 0.1 s. Under overload the TTFT clause is
# the discriminating one (queue wait + eviction re-queue wait); the ITL
# clause guards against a policy that trades tails for admissions.
#
# Predictions on record (§6.5): the `priority` policy raises
# high-priority (class 2) goodput by >= 15 points over `lifo` while
# aggregate tok/s stays within +/-2% across all three policies; `cost`
# beats `lifo` on total goodput but not on high-priority goodput.
# Prediction 4's clauses ride along: every request completes (no
# errors), and the mean re-prefill (preempted_tokens / preemptions)
# stays around one prefill chunk.
#
# Standing gates: no NaN, zero recompiles after warm-up, decode replay
# ~100%, no deadlock/livelock (every repeat drains; preemptions_total
# > 0 on every cell or the round measured nothing). Client max_inflight
# 240 stays under the server's 256 admission cap so overload queues in
# the scheduler, the system under test, not as 429s.
schema_version = 1
name = "goodput-5090"

[server]
model = "0.6B"
engine = "batched"
device = "cuda"
port = 8377
health_timeout_s = 900
max_batch = 64
batch_max_seq_len = 4096
max_tokens_per_step = 512
attention = "flex"
num_kv_blocks = 128
shape_buckets = true
warmup_shapes = true
torch_compile = true
cuda_graphs = true

[server.matrix]
preemption_policy = ["lifo", "priority", "cost"]

[defaults]
dialect = "openai"
max_tokens = 128
ignore_eos = true
temperature = 0.0
warmup_requests = 8
repeats = 3
seed = 0

[[points]]
workload = "short_chat"
mode = "open"
arrivals = "poisson"
rate_rps = [30, 45]
total_requests = 400
max_inflight = 240
priority_mix = {0 = 4, 2 = 1}
slo_ttft_s = 0.5
slo_itl_p99_s = 0.1
