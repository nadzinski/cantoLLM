# Phase-4 round 4 (paged-kv-plan.md §7, chunk 12): overlap on/off x
# {padded, paged}, both arms their FULL serve stacks (buckets + warm-up
# + compile + graphs; flex at parity capacity), so overlap is the one
# moving part. Overlap attacks the CPU-dispatch floor from the
# scheduling side: launch step N+1 before finalizing step N, finalize
# one step late behind a CUDA event.
#
# Predictions on record (§6.6): overlap-on improves short_chat c=16
# aggregate tok/s by +3..10% and the decode cell's engine ITL p50 by
# 5..15%, on both attention arms; the gain is bounded by how much of
# the step is CPU-side dispatch (Phase 3 profiled the floor).
#
# Gates: per-request event order unchanged (greedy token equivalence
# between overlap arms and their serial siblings — a gate, not a
# prediction); no NaN; zero recompiles after warm-up; replay rate
# ~100% on graph arms; error counts zero.
schema_version = 1
name = "ab-5090-overlap"

[server]
model = "0.6B"
engine = "batched"
device = "cuda"
port = 8377
health_timeout_s = 900
max_batch = 16
batch_max_seq_len = 4096
max_tokens_per_step = 512
shape_buckets = true
warmup_shapes = true
torch_compile = true
cuda_graphs = true

[server.matrix]
attention = ["sdpa", "flex"]
overlap_scheduling = [false, true]

[defaults]
dialect = "openai"
max_tokens = 128
ignore_eos = true
temperature = 0.0
warmup_requests = 4
repeats = 3
seed = 0

[[points]]
workload = "short_chat"
mode = "closed"
concurrency = [4, 16]
requests_per_level = 32

[[points]]
workload = "code"
mode = "closed"
concurrency = [8]
requests_per_level = 32

[[points]]
workload = "multi_turn"
mode = "closed"
concurrency = [8]
requests_per_level = 32
