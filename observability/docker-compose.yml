# The Phase 3.5 observability stack: Prometheus (metrics), Tempo (traces),
# Grafana (one UI for both). Host networking: everything binds localhost on
# the 5090 box, and the server's /metrics + OTLP export need no address
# plumbing. See README.md for bring-up.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    network_mode: host          # UI/API on :9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.1
    network_mode: host          # OTLP/HTTP ingest on :4318, query on :3200
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    network_mode: host          # UI on :3000
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prom-data:
  tempo-data:
  grafana-data:
